<!DOCTYPE html>
<html>
<head>
    <title>Sudoku</title>

    <style>
        body {
            background: #f1f3f8;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #222;
        }

        h1 {
            margin-top: 25px;
        }

        .game {
            width: 360px;
            max-width: 95%;
            margin: 20px auto;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: bold;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            border: 3px solid #222;
            background: white;
        }

        .cell {
            aspect-ratio: 1;
            min-width: 0;
            padding: 0;
            border: 1px solid #c5cad5;
            background: white;
            font-size: 20px;
            cursor: pointer;
        }

        .cell:nth-child(3n) {
            border-right: 2px solid #222;
        }

        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #222;
        }

        .cell.fixed {
            background: #e5e8ef;
            font-weight: bold;
            color: #222;
        }

        .cell.selected {
            background: #8ebcff;
        }

        .cell.related {
            background: #e6efff;
        }

        .cell.same {
            background: #c4dcff;
        }

        .cell.error {
            background: #ffcaca;
            color: #a00000;
        }

        .numbers {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            margin-top: 12px;
        }

        .numbers button {
            padding: 10px 0;
            border: none;
            border-radius: 5px;
            background: #dce6fa;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.94);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            justify-content: center;
            margin-top: 12px;
        }

        .controls button,
        select {
            padding: 9px 12px;
            border: none;
            border-radius: 5px;
            background: #344f80;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        select {
            background: white;
            color: #222;
            border: 1px solid #aaa;
        }

        #message {
            min-height: 24px;
            font-weight: bold;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h1>Sudoku</h1>
    <p>Choose a cell, then enter a number.</p>

    <div class="game">

        <div class="info">
            <span>Time: <span id="timer">00:00</span></span>
            <span>Mistakes: <span id="mistakes">0</span></span>
        </div>

        <label for="difficulty">Difficulty: </label>
        <select id="difficulty" onchange="newGame()">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <div id="board"></div>

        <div class="numbers">
            <button onclick="enterNumber(1)">1</button>
            <button onclick="enterNumber(2)">2</button>
            <button onclick="enterNumber(3)">3</button>
            <button onclick="enterNumber(4)">4</button>
            <button onclick="enterNumber(5)">5</button>
            <button onclick="enterNumber(6)">6</button>
            <button onclick="enterNumber(7)">7</button>
            <button onclick="enterNumber(8)">8</button>
            <button onclick="enterNumber(9)">9</button>
        </div>

        <div class="controls">
            <button onclick="eraseCell()">Erase</button>
            <button onclick="getHint()">Hint</button>
            <button onclick="checkBoard()">Check</button>
            <button onclick="newGame()">New Game</button>
            <button onclick="location.href='index.html'">Back to Home</button>
        </div>

        <p id="message"></p>

    </div>

    <script>
        var solution = [
            [5,3,4,6,7,8,9,1,2],
            [6,7,2,1,9,5,3,4,8],
            [1,9,8,3,4,2,5,6,7],
            [8,5,9,7,6,1,4,2,3],
            [4,2,6,8,5,3,7,9,1],
            [7,1,3,9,2,4,8,5,6],
            [9,6,1,5,3,7,2,8,4],
            [2,8,7,4,1,9,6,3,5],
            [3,4,5,2,8,6,1,7,9]
        ];

        var puzzle = [];
        var selected = null;
        var mistakes = 0;
        var seconds = 0;
        var gameOver = false;
        var timerId = null;

        function newGame() {
            clearInterval(timerId);

            var difficulty = document.getElementById("difficulty").value;
            var emptyCells = 35;

            if (difficulty == "medium") {
                emptyCells = 45;
            }

            if (difficulty == "hard") {
                emptyCells = 52;
            }

            puzzle = solution.map(function(row) {
                return row.slice();
            });

            var positions = [];

            for (var i = 0; i < 81; i++) {
                positions.push(i);
            }

            positions.sort(function() {
                return Math.random() - 0.5;
            });

            for (var i = 0; i < emptyCells; i++) {
                var position = positions[i];
                var row = Math.floor(position / 9);
                var col = position % 9;
                puzzle[row][col] = 0;
            }

            selected = null;
            mistakes = 0;
            seconds = 0;
            gameOver = false;

            document.getElementById("mistakes").textContent = mistakes;
            document.getElementById("timer").textContent = "00:00";
            document.getElementById("message").textContent = "";

            createBoard();

            timerId = setInterval(function() {
                if (!gameOver) {
                    seconds++;

                    var minutes = Math.floor(seconds / 60);
                    var remainingSeconds = seconds % 60;

                    document.getElementById("timer").textContent =
                        String(minutes).padStart(2, "0") + ":" +
                        String(remainingSeconds).padStart(2, "0");
                }
            }, 1000);
        }

        function createBoard() {
            var board = document.getElementById("board");
            board.innerHTML = "";

            for (var row = 0; row < 9; row++) {
                for (var col = 0; col < 9; col++) {
                    var cell = document.createElement("button");

                    cell.className = "cell";
                    cell.id = "cell" + row + col;
                    cell.textContent = puzzle[row][col] || "";

                    if (puzzle[row][col] != 0) {
                        cell.classList.add("fixed");
                    }

                    cell.onclick = function() {
                        if (gameOver) return;

                        var row = Number(this.id.charAt(4));
                        var col = Number(this.id.charAt(5));

                        selected = [row, col];
                        updateBoard();
                    };

                    board.appendChild(cell);
                }
            }

            updateBoard();
        }

        function updateBoard() {
            for (var row = 0; row < 9; row++) {
                for (var col = 0; col < 9; col++) {
                    var cell = document.getElementById("cell" + row + col);

                    cell.classList.remove("selected", "related", "same", "error");

                    if (selected != null) {
                        var r = selected[0];
                        var c = selected[1];

                        if (row == r || col == c ||
                            (Math.floor(row / 3) == Math.floor(r / 3) &&
                             Math.floor(col / 3) == Math.floor(c / 3))) {
                            cell.classList.add("related");
                        }

                        if (row == r && col == c) {
                            cell.classList.add("selected");
                        }

                        if (puzzle[row][col] != 0 &&
                            puzzle[row][col] == puzzle[r][c]) {
                            cell.classList.add("same");
                        }
                    }

                    if (puzzle[row][col] != 0 &&
                        puzzle[row][col] != solution[row][col]) {
                        cell.classList.add("error");
                    }
                }
            }
        }

        function enterNumber(number) {
            if (selected == null || gameOver) {
                document.getElementById("message").textContent =
                    "Select an empty cell first.";
                return;
            }

            var row = selected[0];
            var col = selected[1];

            if (solution[row][col] == puzzle[row][col] &&
                puzzle[row][col] != 0) {
                document.getElementById("message").textContent =
                    "Choose an empty cell.";
                return;
            }

            if (puzzle[row][col] == number) {
                return;
            }

            if (number != solution[row][col]) {
                mistakes++;
                document.getElementById("mistakes").textContent = mistakes;
            }

            puzzle[row][col] = number;
            document.getElementById("cell" + row + col).textContent = number;
            document.getElementById("message").textContent = "";

            updateBoard();
            checkWin();
        }

        function eraseCell() {
            if (selected == null || gameOver) return;

            var row = selected[0];
            var col = selected[1];

            if (solution[row][col] == puzzle[row][col] &&
                puzzle[row][col] != 0) {
                document.getElementById("message").textContent =
                    "You cannot erase a starting number.";
                return;
            }

            puzzle[row][col] = 0;
            document.getElementById("cell" + row + col).textContent = "";
            document.getElementById("message").textContent = "";

            updateBoard();
        }

        function getHint() {
            if (selected == null || gameOver) {
                document.getElementById("message").textContent =
                    "Select a cell first.";
                return;
            }

            var row = selected[0];
            var col = selected[1];

            if (puzzle[row][col] == solution[row][col]) {
                document.getElementById("message").textContent =
                    "This cell is already correct.";
                return;
            }

            puzzle[row][col] = solution[row][col];

            document.getElementById("cell" + row + col).textContent =
                solution[row][col];

            document.getElementById("message").textContent = "Hint used!";

            updateBoard();
            checkWin();
        }

        function checkBoard() {
            if (gameOver) return;

            var empty = false;
            var incorrect = false;

            for (var row = 0; row < 9; row++) {
                for (var col = 0; col < 9; col++) {
                    if (puzzle[row][col] == 0) {
                        empty = true;
                    } else if (puzzle[row][col] != solution[row][col]) {
                        incorrect = true;
                    }
                }
            }

            if (incorrect) {
                document.getElementById("message").textContent =
                    "Some numbers are incorrect.";
            } else if (empty) {
                document.getElementById("message").textContent =
                    "So far, all filled numbers are correct!";
            } else {
                checkWin();
            }

            updateBoard();
        }

        function checkWin() {
            for (var row = 0; row < 9; row++) {
                for (var col = 0; col < 9; col++) {
                    if (puzzle[row][col] != solution[row][col]) {
                        return;
                    }
                }
            }

            gameOver = true;
            clearInterval(timerId);

            document.getElementById("message").textContent =
                "Congratulations! You solved Sudoku!";
        }

        document.addEventListener("keydown", function(event) {
            if (event.key >= "1" && event.key <= "9") {
                enterNumber(Number(event.key));
            }

            if (event.key == "Backspace" || event.key == "Delete") {
                eraseCell();
            }
        });

        newGame();
    </script>

</body>
</html>
